name: Build and Publish Docker Image

on:
  push:
    branches: ['main'] # Runs automatically when you push code to main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: devvyyxyz/osint-toolkit

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to publish to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Provided automatically by GitHub

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Looks for the Dockerfile in your root folder
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
